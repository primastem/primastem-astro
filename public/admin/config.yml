          label: Title
          widget: string
        - name: items
          label: Items
          widget: list
          field:
            name: item
            label: Item
            widget: string
      - name: specs
        label: Specs
        widget: list
        fields:
        - name: label
          label: Label
          widget: string
        - name: value
          label: Value
          widget: text
      - name: commands
        label: Commands
        widget: list
        fields:
        - name: label
          label: Label
          widget: string
        - name: value
          label: Value
          widget: string
      - name: features
